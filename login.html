<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Área da Equipe - Patinhas &amp; Cia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-paw"></i> Patinhas &amp; Cia</h1>
        <p>Área da equipe</p>
    </header>

    <main>
        <form action="" id="form-login" class="formulario">
            <div class="campo">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <button type="submit" id="botao-entrar">Entrar</button>
        </form>

        <a href="index.html" class="link-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar para a área do tutor</a>
    </main>
</body>
</html>
