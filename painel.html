<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel da Equipe - Patinhas &amp; Cia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-paw"></i> Patinhas &amp; Cia</h1>
        <p>Painel da equipe</p>
        <button type="button" id="botao-sair">Sair</button>
        <nav aria-label="Navegação do painel"><a href="assinaturas.html">Assinaturas</a></nav>
    </header>

    <main>
        <section id="agenda">
            <h2>Agenda do dia</h2>

            <div class="campo">
                <label for="data-agenda">Data</label>
                <input type="date" id="data-agenda">
            </div>

            <button type="button" id="abrir-agendamento">Novo agendamento</button>

            <div id="mensagem-agenda" role="status"></div>
            
            <details>
                <summary><i class="fa-solid fa-filter" aria-hidden="true"></i> Filtros</summary>

                <div class="campo">
                    <label for="filtro-pagamento">Pagamento</label>
                    <select name="filtro-pagamento" id="filtro-pagamento">
                        <option value="">Todos</option>
                        <option value="pendente">Pendente</option>
                        <option value="pago">Pago</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="filtro-status">Status</label>
                    <select name="filtro-status" id="filtro-status">
                        <option value="">Todos</option>
                        <option value="agendado">Agendado</option>
                        <option value="concluido">Concluído</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>
            </details>

            <div id="totais">
                <p id="total-dia" role="status"></p>
                <p id="total-recebido" role="status"></p>
            </div>

            <div id="lista-agenda"></div>
        </section>

        <dialog id="agendamento-manual" aria-labelledby="titulo-agendamento">
            <button type="button" id="fechar-agendamento" aria-label="Fechar">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>

            <h2 id="titulo-agendamento">Agendamento manual</h2>

            <form action="" id="form-manual" class="formulario">
                <div class="campo">
                    <label for="nome">Nome do tutor</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone do tutor</label>
                    <input type="tel" id="telefone" name="telefone" required>
                </div>

                <div class="campo">
                    <label for="pet-nome">Nome do pet</label>
                    <input type="text" id="pet-nome" name="pet-nome" required>
                </div>

                <div class="campo">
                    <label for="especie">Espécie</label>
                    <select name="especie" id="especie" required>
                        <option value="">Selecione</option>
                        <option value="cachorro">Cachorro</option>
                        <option value="gato">Gato</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="servico">Serviço</label>
                    <select name="servico" id="servico" required>
                        <option value="">Selecione</option>
                    </select>
                </div>

                <div id="opcoes-tosa" class="campo" hidden>
                    <label for="tipo-tosa">Tipo de tosa</label>
                    <select name="tipo-tosa" id="tipo-tosa">
                        <option value="">Selecione</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="data">Data</label>
                    <input type="date" id="data" name="data" required>
                </div>

                <div class="campo">
                    <label for="horario">Horário</label>
                    <select name="horario" id="horario" required>
                        <option value="">Selecione</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input type="number" id="valor" name="valor" step="0.01" required>
                </div>

                <div class="campo">
                    <label for="pagamento">Pagamento</label>
                    <select name="pagamento" id="pagamento" required>
                        <option value="">Selecione</option>
                        <option value="pendente">Pendente</option>
                        <option value="pago">Pago</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="informacao-adicional">Informações adicionais</label>
                    <textarea name="informacao-adicional" id="informacao-adicional" placeholder="Alguma observação? Ex.: seu pet é alérgico, medroso..."></textarea>
                </div>

                <button type="submit" id="botao-salvar">Agendar</button>
            </form>

            <div id="mensagem-confirmacao" role="status"></div>
        </dialog>
    </main>

    <script src="scripts/servicos.js"></script>
    <script src="scripts/comum.js"></script>
    <script src="scripts/formulario.js"></script>
    <script src="scripts/painel.js"></script>
</body>
</html>
